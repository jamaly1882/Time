name: Build Flutter APK

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع الرئيسي عندك
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مطلوبة لبناء أندرويد)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # إصدار مستقر ومتوافق جداً مع فلاتر الحديث

      # 3. إعداد فلاتر وتحديد الإصدار المستقر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2' # نفس الإصدار المستخدم في مشروعك
          channel: 'stable'

      # 4. تنظيف الكاش وجلب الحزم من الصفر (لحل مشكلة الـ v1 embedding)
      - name: Install dependencies & Clean cache
        run: |
          flutter clean
          flutter pub get

      # 5. بناء نسخة الـ APK الموجهة للنشر
      - name: Build APK
        run: flutter build apk --release

      # 6. رفع ملف الـ APK الناتج لكي تتمكن من تحميله من الـ Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
