name: Build Flutter APK with Attestation

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع الرئيسي عندك
  pull_request:
    branches:
      - main

# تعيين الصلاحيات اللازمة لإنشاء الشهادات الأمنية (Attestations)
permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع (نسخة متوافقة ومحدثة)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا باستخدام الإصدار v5 المستقر والموصى به
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد فلاتر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      # 4. تنظيف الكاش وجلب الحزم من الصفر
      - name: Install dependencies & Clean cache
        run: |
          flutter clean
          flutter pub get

      # 5. بناء نسخة الـ APK الموجهة للنشر
      - name: Build APK
        run: flutter build apk --release

      # 6. إنشاء الشهادة الأمنية (Attestation) للملف الناتج
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/app/outputs/flutter-apk/app-release.apk'

      # 7. رفع ملف الـ APK الناتج لكي تتمكن من تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
