name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      # 3. معلومات Flutter
      - name: Flutter Doctor
        run: flutter doctor -v

      # 4. تنظيف المشروع
      - name: Clean Project
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build
          rm -rf android/.gradle
          rm -rf android/app/build

      # 5. تحميل الحزم
      - name: Get Dependencies
        run: flutter pub get

      # 6. فحص Android V1 embedding
      - name: Check Android V1 Embedding
        run: |
          echo "======================================"
          echo "Searching for Android V1 embedding..."
          echo "======================================"

          grep -RniE \
            "io\.flutter\.app|io\.flutter\.plugin\.common\.PluginRegistry|registerWith" \
            android .dart_tool \
            --exclude-dir=build \
            || true

          echo "======================================"
          echo "Flutter dependencies"
          echo "======================================"

          flutter pub deps --style=compact

      # 7. فحص المشروع
      - name: Analyze
        run: flutter analyze

      # 8. بناء APK
      - name: Build APK
        run: flutter build apk --release

      # 9. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-reminder-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
